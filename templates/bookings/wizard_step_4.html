{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container" style="max-width: 600px; margin: 60px auto;">
  <div class="form-card">
    <div class="section-head">
      <div style="text-align: center; width: 100%;">
        <span class="eyebrow">Step 4 of 6</span>
        <h2>{% trans "Schedule" %}</h2>
        <p>{% trans "When do you need the service?" %}</p>
      </div>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="grid grid-2" style="gap: 16px; margin-bottom: 18px;">
        <div class="form-group">
          <label>{% trans "Preferred Date" %}</label>
          <input type="date" name="scheduled_date" class="input-field" value="{{ data.scheduled_date }}">
        </div>
        <div class="form-group">
          <label>{% trans "Preferred Time" %}</label>
          <input type="time" name="scheduled_time" class="input-field" value="{{ data.scheduled_time }}">
        </div>
      </div>

      <div class="flex justify-between" style="margin-top: 32px; gap: 16px;">
        <button type="submit" name="action" value="prev" class="btn btn-ghost">{% trans "Back" %}</button>
        <button type="submit" name="action" value="next" class="btn btn-primary">{% trans "Next" %} <svg><use href="#icon-arrow-right"/></svg></button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
